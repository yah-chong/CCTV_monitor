<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>高雄市即時路況監視器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    #map { width: 100%; height: 100vh; }

    /* 頂部控制面板 */
    .control-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      max-width: 650px;
      margin: 0 auto;
    }
    select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      font-size: 14px;
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background: #1a73e8;
      color: #fff;
      border: none;
      font-weight: 500;
    }
    button.primary:active { background: #1557b0; }
    button.active-filter {
      background: #e63946;
      color: #fff;
      border-color: #e63946;
    }
    .status-text {
      width: 100%;
      font-size: 12px;
      color: #555;
      margin-top: 2px;
    }

    /* 影像 Popup 視窗 */
    .cctv-popup { width: 290px; }
    .cctv-popup h4 {
      margin: 0 0 4px 0;
      font-size: 15px;
      color: #1a73e8;
    }
    .cctv-popup .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }
    .cctv-stream {
      width: 100%;
      height: 190px;
      background: #111;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <select id="district-select">
      <option value="ALL">全部行政區</option>
      <option value="鳳山區">鳳山區</option>
      <option value="三民區">三民區</option>
      <option value="左營區">左營區</option>
      <option value="鼓山區">鼓山區</option>
      <option value="苓雅區">苓雅區</option>
      <option value="前鎮區">前鎮區</option>
      <option value="新興區">新興區</option>
      <option value="前金區">前金區</option>
      <option value="鹽埕區">鹽埕區</option>
      <option value="楠梓區">楠梓區</option>
      <option value="小港區">小港區</option>
      <option value="仁武區">仁武區</option>
      <option value="鳥松區">鳥松區</option>
      <option value="大寮區">大寮區</option>
      <option value="林園區">林園區</option>
      <option value="岡山區">岡山區</option>
      <option value="橋頭區">橋頭區</option>
      <option value="路竹區">路竹區</option>
      <option value="旗山區">旗山區</option>
      <option value="美濃區">美濃區</option>
      <option value="杉林區">杉林區</option>
    </select>

    <button id="btn-nearby" class="primary">📍 我附近 1 公里內</button>
    <button id="btn-reset">顯示全部</button>
    <div id="status" class="status-text">正在連線至代理伺服器載入資料...</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ====================================================
    // 1. 請填入你的 Cloudflare Worker 網址 (結尾不要加斜線)
    // ====================================================
    const WORKER_URL = "https://你的worker名稱.你的帳號.workers.dev";

    const statusEl = document.getElementById("status");
    const districtSelect = document.getElementById("district-select");
    const btnNearby = document.getElementById("btn-nearby");
    const btnReset = document.getElementById("btn-reset");

    // 初始化地圖 (預設鳳山區中心)
    const map = L.map("map", { zoomControl: false }).setView([22.6273, 120.3575], 13);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let allCCTVs = [];
    let markersLayer = L.layerGroup().addTo(map);
    let userLocationMarker = null;
    let userRadiusCircle = null;

    // 計算兩點經緯度距離 (單位：公里，Haversine 公式)
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 轉換串流網址 (如果是 http:// 就自動走 Worker Proxy 轉成 https://)
    function getSafeStreamUrl(rawUrl) {
      if (!rawUrl) return "";
      if (rawUrl.startsWith("http://")) {
        return `${WORKER_URL}/stream?url=${encodeURIComponent(rawUrl)}`;
      }
      return rawUrl;
    }

    // 渲染標記到地圖上
    function renderMarkers(list, fitBounds = false) {
      markersLayer.clearLayers();
      const bounds = [];

      list.forEach(cam => {
        const lat = cam.PositionLat;
        const lon = cam.PositionLon;
        if (!lat || !lon || !cam.VideoStreamURL) return;

        bounds.push([lat, lon]);
        const roadName = cam.RoadName || "未命名路段";
        const desc = cam.SurveillanceDescription || cam.Direction || "";
        const district = cam.TownName || "";
        const safeUrl = getSafeStreamUrl(cam.VideoStreamURL);

        const marker = L.circleMarker([lat, lon], {
          radius: 7,
          fillColor: "#e63946",
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });

        marker.on("click", () => {
          const popupHtml = `
            <div class="cctv-popup">
              <h4>${roadName}</h4>
              <div class="meta">${district} ${desc}</div>
              <img class="cctv-stream" src="${safeUrl}" alt="影像載入中..." 
                   onerror="this.alt='此攝影機目前離線或無訊號';" />
            </div>
          `;
          marker.bindPopup(popupHtml, { maxWidth: 310 }).openPopup();
        });

        markersLayer.addLayer(marker);
      });

      statusEl.textContent = `目前顯示 ${bounds.length} 支攝影機（點擊紅點觀看即時影像）`;

      if (fitBounds && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    // 清除 GPS 範圍圈
    function clearUserLocationOverlay() {
      if (userLocationMarker) map.removeLayer(userLocationMarker);
      if (userRadiusCircle) map.removeLayer(userRadiusCircle);
      btnNearby.classList.remove("active-filter");
    }

    // 事件：依行政區篩選
    districtSelect.addEventListener("change", (e) => {
      clearUserLocationOverlay();
      const selected = e.target.value;
      if (selected === "ALL") {
        renderMarkers(allCCTVs, false);
        return;
      }

      const filtered = allCCTVs.filter(cam =>
        (cam.TownName && cam.TownName.includes(selected)) ||
        (cam.SurveillanceDescription && cam.SurveillanceDescription.includes(selected))
      );

      if (filtered.length === 0) {
        statusEl.textContent = `${selected} 目前無 TDX 連線攝影機資料`;
        markersLayer.clearLayers();
      } else {
        renderMarkers(filtered, true);
      }
    });

    // 事件：定位我附近 1 公里內
    btnNearby.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("您的瀏覽器不支援 GPS 定位功能");
        return;
      }

      statusEl.textContent = "正在取得您的 GPS 位置...";
      districtSelect.value = "ALL";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const userLat = pos.coords.latitude;
          const userLon = pos.coords.longitude;

          clearUserLocationOverlay();
          btnNearby.classList.add("active-filter");

          // 標記目前位置與 1 公里半徑圈
          userLocationMarker = L.marker([userLat, userLon])
            .addTo(map)
            .bindPopup("您的目前位置")
            .openPopup();

          userRadiusCircle = L.circle([userLat, userLon], {
            radius: 1000,
            color: "#1a73e8",
            fillColor: "#1a73e8",
            fillOpacity: 0.1
          }).addTo(map);

          // 篩選距離 <= 1.0 公里的攝影機
          const nearbyCCTVs = allCCTVs.filter(cam => {
            if (!cam.PositionLat || !cam.PositionLon) return false;
            return getDistanceKm(userLat, userLon, cam.PositionLat, cam.PositionLon) <= 1.0;
          });

          map.setView([userLat, userLon], 15);
          renderMarkers(nearbyCCTVs, false);
          statusEl.textContent = `您附近 1 公里內共有 ${nearbyCCTVs.length} 支攝影機`;
        },
        (err) => {
          statusEl.textContent = `定位失敗：請確認已允許網頁存取位置權限 (${err.message})`;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // 事件：重設顯示全部
    btnReset.addEventListener("click", () => {
      clearUserLocationOverlay();
      districtSelect.value = "ALL";
      renderMarkers(allCCTVs, false);
    });

    // 初始化載入資料
    async function init() {
      try {
        if (WORKER_URL.includes("你的worker名稱")) {
          statusEl.textContent = "請先設定程式碼中的 WORKER_URL";
          return;
        }
        const res = await fetch(`${WORKER_URL}/cctv`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allCCTVs = data.CCTVs || [];
        renderMarkers(allCCTVs, false);
      } catch (err) {
        statusEl.textContent = `資料載入失敗：${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
