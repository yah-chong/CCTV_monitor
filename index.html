<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高雄市監視器即時動態查看器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
    }
    .cam-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .cam-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      cursor: pointer;
    }
    .cam-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }

    .viewer {
      max-width: 820px;
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #334155;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .controls button, .controls select, .controls a {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }
    .screen-box {
      position: relative;
      width: 100%;
      height: 520px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .screen-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <h1>點選監視器查看最新動態</h1>

  <div id="cam-list" class="cam-list"></div>

  <div class="viewer">
    <div class="toolbar">
      <span id="cam-title">尚未選擇監視器</span>
      <div class="controls">
        <button id="btn-refresh">立即重新整理</button>
        <button id="btn-toggle">暫停自動更新</button>
        <select id="interval-select" title="更新頻率">
          <option value="10000">每 10 秒</option>
          <option value="15000" selected>每 15 秒</option>
          <option value="30000">每 30 秒</option>
          <option value="60000">每 60 秒</option>
        </select>
        <a id="btn-ext" href="#" target="_blank" rel="noopener">新視窗開啟 ↗</a>
      </div>
    </div>

    <div class="screen-box" id="screen-box"></div>
    <div id="update-time" style="margin-top:8px;font-size:12px;color:#94a3b8;"></div>
  </div>

  <script>
    const CAMERAS = [
      {
        name: "自訂監視器 A (KHC000361)",
        url: "https://tw.live/cam/?id=KHC000361"
      },
      {
        name: "自訂監視器 B (KHC000417)",
        url: "https://tw.live/cam/?id=KHC000417"
      }
    ];

    const camListEl = document.getElementById("cam-list");
    const camTitleEl = document.getElementById("cam-title");
    const screenBoxEl = document.getElementById("screen-box");
    const updateTimeEl = document.getElementById("update-time");
    const btnRefresh = document.getElementById("btn-refresh");
    const btnToggle = document.getElementById("btn-toggle");
    const intervalSelect = document.getElementById("interval-select");
    const btnExt = document.getElementById("btn-ext");

    let currentCam = null;
    let timerId = null;
    let isAutoRefresh = true;

    function loadCameraFrame() {
      if (!currentCam) return;

      screenBoxEl.innerHTML = `<iframe src="${currentCam.url}" allowfullscreen loading="eager"></iframe>`;
      btnExt.href = currentCam.url;

      const now = new Date().toLocaleTimeString("zh-TW", { hour12: false });
      updateTimeEl.textContent = `最後載入時間：${now}`;
    }

    function restartTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      if (currentCam && isAutoRefresh) {
        const ms = parseInt(intervalSelect.value, 10);
        timerId = setInterval(loadCameraFrame, ms);
      }
    }

    function selectCamera(cam, btnEl) {
      currentCam = cam;
      document.querySelectorAll(".cam-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");

      camTitleEl.textContent = `目前觀看：${cam.name}`;
      loadCameraFrame();
      restartTimer();
    }

    CAMERAS.forEach((cam, idx) => {
      const btn = document.createElement("button");
      btn.className = "cam-btn";
      btn.textContent = cam.name;
      btn.addEventListener("click", () => selectCamera(cam, btn));
      camListEl.appendChild(btn);

      if (idx === 0) {
        selectCamera(cam, btn);
      }
    });

    btnRefresh.addEventListener("click", loadCameraFrame);

    btnToggle.addEventListener("click", () => {
      isAutoRefresh = !isAutoRefresh;
      btnToggle.textContent = isAutoRefresh ? "暫停自動更新" : "繼續自動更新";
      restartTimer();
    });

    intervalSelect.addEventListener("change", restartTimer);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (timerId) clearInterval(timerId);
      } else if (currentCam && isAutoRefresh) {
        loadCameraFrame();
        restartTimer();
      }
    });
  </script>
</body>
</html>
