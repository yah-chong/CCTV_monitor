<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高雄市監視器快速查看器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
    }
    p.desc {
      font-size: 13px;
      color: #94a3b8;
      margin: 0 0 18px 0;
      line-height: 1.5;
    }
    .cam-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .cam-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .cam-info h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #f1f5f9;
    }
    .cam-info span {
      font-size: 12px;
      color: #94a3b8;
    }
    .btn-open {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-open:hover {
      background: #0369a1;
    }
    .btn-open.viewed {
      background: #0f766e;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>高雄市路口監視器快速清單</h1>
    <p class="desc">點擊按鈕將開啟獨立小視窗觀看即時動態（重複點擊不同監視器會在同一個視窗切換，不會開一堆分頁）。</p>

    <div id="cam-grid" class="cam-grid"></div>
  </div>

  <script>
    const CAMERAS = [
      {
        id: "KHC000361",
        name: "自訂監視器 A",
        url: "https://tw.live/cam/?id=KHC000361"
      },
      {
        id: "KHC000417",
        name: "自訂監視器 B",
        url: "https://tw.live/cam/?id=KHC000417"
      }
    ];

    const gridEl = document.getElementById("cam-grid");
    let viewerWindow = null;

    function openCameraPopup(cam, btnEl) {
      // 設定小視窗尺寸與位置
      const width = 860;
      const height = 640;
      const left = Math.max(0, (screen.width - width) / 2);
      const top = Math.max(0, (screen.height - height) / 2);

      // 使用固定視窗名稱 "kh_cctv_viewer"，點不同監視器會直接在同一個小視窗切換
      viewerWindow = window.open(
        cam.url,
        "kh_cctv_viewer",
        `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
      );

      if (viewerWindow) {
        viewerWindow.focus();
      }

      document.querySelectorAll(".btn-open").forEach(b => b.classList.remove("viewed"));
      btnEl.classList.add("viewed");
      btnEl.textContent = "觀看中 / 重新整理";
    }

    CAMERAS.forEach(cam => {
      const card = document.createElement("div");
      card.className = "cam-card";

      card.innerHTML = `
        <div class="cam-info">
          <h3>${cam.name}</h3>
          <span>代碼：${cam.id}</span>
        </div>
      `;

      const btn = document.createElement("button");
      btn.className = "btn-open";
      btn.textContent = "開啟即時畫面 ↗";
      btn.addEventListener("click", () => openCameraPopup(cam, btn));

      card.appendChild(btn);
      gridEl.appendChild(card);
    });
  </script>
</body>
</html>
