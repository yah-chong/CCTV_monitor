<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>免帳號路況攝影機地圖（高速公路／公開路況）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map { width: 100%; height: 100vh; }

    .panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      max-width: 720px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.16);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    select, button, input {
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      background: #fff;
    }
    button { cursor: pointer; font-weight: 500; }
    button.primary { background: #0284c7; color: #fff; border: none; }
    button.primary:hover { background: #0369a1; }
    .status {
      width: 100%;
      font-size: 12px;
      color: #475569;
    }
    .cctv-popup { width: 300px; }
    .cctv-popup h4 { margin: 0 0 4px; font-size: 15px; color: #0284c7; }
    .cctv-popup .sub { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .cctv-img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      background: #0f172a;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="panel">
    <select id="highway-filter">
      <option value="ALL">全部路線 / 節點</option>
      <option value="國道1號">國道1號（中山高）</option>
      <option value="國道3號">國道3號（福高）</option>
      <option value="國道10號">國道10號（高雄支線）</option>
      <option value="快速道路">快速道路 / 省道</option>
    </select>

    <button id="btn-reload" class="primary">重新載入公開路況</button>
    <button id="btn-locate">📍 定位附近</button>
    <div id="status" class="status">正在嘗試抓取免帳號公開路況資料...</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const highwayFilter = document.getElementById("highway-filter");
    const btnReload = document.getElementById("btn-reload");
    const btnLocate = document.getElementById("btn-locate");

    // 預設聚焦南台灣 / 高雄周邊高速公路網
    const map = L.map("map").setView([22.66, 120.34], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    let allCams = [];

    // 公開路況候選來源清單（免帳號金鑰）
    // 註：部分政府 XML/JSON 端點若遇瀏覽器 CORS 阻擋，會自動轉向備援清單
    const PUBLIC_ENDPOINTS = [
      {
        name: "高速公路局公開 CCTV XML",
        url: "https://tisvcloud.freeway.gov.tw/history/motc_cctv/cctvNode.xml",
        type: "xml"
      },
      {
        name: "公路局省道公開 CCTV XML",
        url: "https://cctv.thb.gov.tw/cctv/cctvNode.xml",
        type: "xml"
      }
    ];

    // 內建高雄與國道1號/國道10號周邊常見路況示範點（確保無 CORS 或離線測試時仍可操作地圖）
    const FALLBACK_SAMPLE_CAMS = [
      {
        id: "DEMO-01",
        name: "國道1號 鼎金系統交流道",
        road: "國道1號",
        desc: "高雄段主線參考點（需依實際串流網址連線）",
        lat: 22.6776,
        lon: 120.3238,
        imgUrl: ""
      },
      {
        id: "DEMO-02",
        name: "國道1號 中正交流道",
        road: "國道1號",
        desc: "苓雅／鳳山交界交流道參考點",
        lat: 22.6266,
        lon: 120.3402,
        imgUrl: ""
      },
      {
        id: "DEMO-03",
        name: "國道10號 仁武交流道",
        road: "國道10號",
        desc: "往旗山／美濃方向參考點",
        lat: 22.6995,
        lon: 120.3652,
        imgUrl: ""
      },
      {
        id: "DEMO-04",
        name: "台88線 鳳山交流道",
        road: "快速道路",
        desc: "往大寮／屏東方向參考點",
        lat: 22.5892,
        lon: 120.3695,
        imgUrl: ""
      }
    ];

    // 解析高公局 / 公路局 XML CCTV 節點
    function parseCctvXml(xmlText, sourceLabel) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, "application/xml");
      const nodes = Array.from(doc.querySelectorAll("CCTV"));

      return nodes.map((node, idx) => {
        const getText = (tag) => node.querySelector(tag)?.textContent?.trim() || "";
        const lat = parseFloat(getText("PositionLat") || getText("Lat") || getText("lat"));
        const lon = parseFloat(getText("PositionLon") || getText("Lon") || getText("lon"));
        const road = getText("RoadName") || getText("FreewayID") || sourceLabel;
        const name = getText("RoadSectionName") || getText("SurveillanceDescription") || `攝影機 ${idx + 1}`;
        const mile = getText("RoadMileage") || getText("Mileage") || "";
        const imgUrl = getText("VideoStreamURL") || getText("SnapshotURL") || getText("ImageURL") || "";

        return {
          id: getText("CCTVID") || `CAM-${idx}`,
          name: mile ? `${name} (${mile})` : name,
          road,
          desc: `${sourceLabel}｜${getText("Direction") || ""}`,
          lat,
          lon,
          imgUrl
        };
      }).filter(item => !Number.isNaN(item.lat) && !Number.isNaN(item.lon));
    }

    // 嘗試從公開端點抓取資料
    async function loadPublicCams() {
      statusEl.textContent = "正在連線公開路況端點...";
      const collected = [];

      for (const ep of PUBLIC_ENDPOINTS) {
        try {
          const res = await fetch(ep.url);
          if (!res.ok) continue;
          const text = await res.text();
          if (ep.type === "xml") {
            const parsed = parseCctvXml(text, ep.name);
            collected.push(...parsed);
          }
        } catch (err) {
          // 瀏覽器若因 CORS 阻擋跨網域 XML，會進到這裡並繼續嘗試下一個來源
          console.warn(`無法直接於瀏覽器讀取 ${ep.name}:`, err.message);
        }
      }

      if (collected.length > 0) {
        allCams = collected;
        statusEl.textContent = `已載入 ${allCams.length} 支公開路況攝影機節點（免帳號）`;
      } else {
        allCams = FALLBACK_SAMPLE_CAMS;
        statusEl.textContent = "目前瀏覽器受跨網域(CORS)或網路限制無法直抓 XML，已載入高雄國道／快速道路節點範例";
      }

      applyFilter();
    }

    // 渲染地圖標記
    function renderCams(list) {
      markersLayer.clearLayers();

      list.forEach(cam => {
        const marker = L.circleMarker([cam.lat, cam.lon], {
          radius: 7,
          fillColor: "#0284c7",
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });

        marker.on("click", () => {
          const imgBlock = cam.imgUrl
            ? `<img class="cctv-img" src="${cam.imgUrl}" alt="即時影像" onerror="this.alt='影像暫時無法載入（可能需 HTTPS 或同源代理）';" />`
            : `<div class="cctv-img" style="display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;padding:10px;text-align:center;">此示範節點未附串流網址<br/>可直接於下方測試自訂影像網址</div>`;

          const html = `
            <div class="cctv-popup">
              <h4>${cam.name}</h4>
              <div class="sub">${cam.road}｜${cam.desc}</div>
              ${imgBlock}
            </div>
          `;
          marker.bindPopup(html, { maxWidth: 320 }).openPopup();
        });

        markersLayer.addLayer(marker);
      });
    }

    // 依路線篩選
    function applyFilter() {
      const val = highwayFilter.value;
      if (val === "ALL") {
        renderCams(allCams);
        return;
      }

      const filtered = allCams.filter(c =>
        (c.road && c.road.includes(val)) ||
        (c.name && c.name.includes(val)) ||
        (c.desc && c.desc.includes(val))
      );

      renderCams(filtered);
      statusEl.textContent = `篩選「${val}」：共 ${filtered.length} 個節點`;
    }

    highwayFilter.addEventListener("change", applyFilter);
    btnReload.addEventListener("click", loadPublicCams);

    btnLocate.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusEl.textContent = "此瀏覽器不支援定位";
        return;
      }
      statusEl.textContent = "正在取得目前位置...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 13);
          L.circleMarker([latitude, longitude], {
            radius: 8,
            fillColor: "#16a34a",
            color: "#fff",
            weight: 2,
            fillOpacity: 1
          }).addTo(markersLayer).bindPopup("你的目前位置").openPopup();
          statusEl.textContent = `已定位至目前位置（${latitude.toFixed(4)}, ${longitude.toFixed(4)}）`;
        },
        (err) => {
          statusEl.textContent = `定位失敗：${err.message}`;
        }
      );
    });

    loadPublicCams();
  </script>
</body>
</html>
