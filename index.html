<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>監視器即時動態查看器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
    }
    /* 監視器清單按鈕列 */
    .cam-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .cam-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      cursor: pointer;
    }
    .cam-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }

    /* 畫面顯示區 */
    .viewer {
      max-width: 720px;
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #334155;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .controls button, .controls select {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      cursor: pointer;
    }
    .screen-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .msg {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>

  <h1>點選監視器查看最新動態</h1>

  <!-- 1. 監視器清單（可自行增減） -->
  <div id="cam-list" class="cam-list"></div>

  <!-- 2. 畫面視窗 -->
  <div class="viewer">
    <div class="toolbar">
      <span id="cam-title">尚未選擇監視器</span>
      <div class="controls">
        <button id="btn-refresh">立即更新</button>
        <button id="btn-toggle">暫停自動更新</button>
        <select id="interval-select" title="更新頻率">
          <option value="2000">每 2 秒</option>
          <option value="3000" selected>每 3 秒</option>
          <option value="5000">每 5 秒</option>
          <option value="10000">每 10 秒</option>
        </select>
      </div>
    </div>

    <div class="screen-box" id="screen-box">
      <div class="msg">請點選上方任一監視器名稱開始觀看</div>
    </div>
    <div id="update-time" style="margin-top:8px;font-size:12px;color:#94a3b8;"></div>
  </div>

  <script>
    // ==================================================
    // 在這裡放入你想看的監視器名稱與影像網址
    // （支援定時更新的 JPG 網址，也支援 MJPEG 串流）
    // ==================================================
    const CAMERAS = [
      {
        name: "測試畫面 1（每 3 秒看動態）",
        url: "https://picsum.photos/800/500"
      },
      {
        name: "自訂監視器 A",
        url: "" // 填入你的監視器影像網址
      },
      {
        name: "自訂監視器 B",
        url: "" // 填入你的監視器影像網址
      }
    ];

    const camListEl = document.getElementById("cam-list");
    const camTitleEl = document.getElementById("cam-title");
    const screenBoxEl = document.getElementById("screen-box");
    const updateTimeEl = document.getElementById("update-time");
    const btnRefresh = document.getElementById("btn-refresh");
    const btnToggle = document.getElementById("btn-toggle");
    const intervalSelect = document.getElementById("interval-select");

    let currentCam = null;
    let timerId = null;
    let isAutoRefresh = true;

    // 加上時間戳記，避免瀏覽器沿用舊快取
    function buildCacheBustUrl(rawUrl) {
      const sep = rawUrl.includes("?") ? "&" : "?";
      return `${rawUrl}${sep}_t=${Date.now()}`;
    }

    // 抓取並顯示最新一張畫面
    function fetchLatestFrame() {
      if (!currentCam) return;

      if (!currentCam.url) {
        screenBoxEl.innerHTML = `<div class="msg">「${currentCam.name}」尚未填入影像網址</div>`;
        updateTimeEl.textContent = "";
        return;
      }

      const img = document.createElement("img");
      img.alt = currentCam.name;

      img.onload = () => {
        screenBoxEl.innerHTML = "";
        screenBoxEl.appendChild(img);
        const now = new Date().toLocaleTimeString("zh-TW", { hour12: false });
        updateTimeEl.textContent = `最後更新時間：${now}`;
      };

      img.onerror = () => {
        screenBoxEl.innerHTML = `<div class="msg">無法載入此影像網址<br/>（可能是網址失效、需 HTTPS 代理，或來源阻擋跨網域）</div>`;
      };

      // 先載入到記憶體 img，成功 onload 後再替換畫面，避免閃爍
      img.src = buildCacheBustUrl(currentCam.url);
    }

    // 啟動或重設計時器
    function restartTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      if (currentCam && currentCam.url && isAutoRefresh) {
        const ms = parseInt(intervalSelect.value, 10);
        timerId = setInterval(fetchLatestFrame, ms);
      }
    }

    // 選擇監視器
    function selectCamera(cam, btnEl) {
      currentCam = cam;
      document.querySelectorAll(".cam-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");

      camTitleEl.textContent = `目前觀看：${cam.name}`;
      fetchLatestFrame();
      restartTimer();
    }

    // 建立按鈕清單
    CAMERAS.forEach((cam, idx) => {
      const btn = document.createElement("button");
      btn.className = "cam-btn";
      btn.textContent = cam.name;
      btn.addEventListener("click", () => selectCamera(cam, btn));
      camListEl.appendChild(btn);

      // 預設先選第一顆方便立刻測試
      if (idx === 0) {
        selectCamera(cam, btn);
      }
    });

    btnRefresh.addEventListener("click", () => {
      fetchLatestFrame();
    });

    btnToggle.addEventListener("click", () => {
      isAutoRefresh = !isAutoRefresh;
      btnToggle.textContent = isAutoRefresh ? "暫停自動更新" : "繼續自動更新";
      restartTimer();
    });

    intervalSelect.addEventListener("change", () => {
      restartTimer();
    });

    // 分頁切到背景時自動省電暫停，切回來立刻更新
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (timerId) clearInterval(timerId);
      } else if (currentCam && isAutoRefresh) {
        fetchLatestFrame();
        restartTimer();
      }
    });
  </script>
</body>
</html>
